name: CI — lint, test, build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [kyc-service, circles-service, lending-service, arbitration-service, payments-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run smoke tests
        run: pytest -v

      - name: Build Docker image (no push on PRs)
        run: docker build -t cmst-${{ matrix.service }}:ci .

  dbt-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-duckdb (fast, dependency-free CI check)
        run: pip install dbt-duckdb

      - name: Write ephemeral duckdb profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          cmst:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/cmst_ci.duckdb
                schema: analytics
          PROFILE

      - name: dbt seed + run + test
        run: |
          dbt seed --target ci
          dbt run --target ci
          dbt test --target ci

  terraform-fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, just to validate)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
