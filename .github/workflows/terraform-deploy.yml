name: Terraform — plan & apply

# Plans on every PR touching infra/, applies only on merge to main.
# Requires repo secrets: AWS_ROLE_ARN (OIDC role — no long-lived keys),
# and repo variables *_IMAGE_URI for each of the five services, plus a
# "production" environment with a required reviewer configured in
# GitHub repo Settings > Environments for the apply job.

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

env:
  TF_VAR_kyc_image_uri: ${{ vars.KYC_IMAGE_URI }}
  TF_VAR_circles_image_uri: ${{ vars.CIRCLES_IMAGE_URI }}
  TF_VAR_lending_image_uri: ${{ vars.LENDING_IMAGE_URI }}
  TF_VAR_arbitration_image_uri: ${{ vars.ARBITRATION_IMAGE_URI }}
  TF_VAR_payments_image_uri: ${{ vars.PAYMENTS_IMAGE_URI }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan

  apply:
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production   # <- gate: requires manual approval in GitHub UI
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform apply -auto-approve
